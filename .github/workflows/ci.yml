# CI for every push and pull request (build plan task 1).
# It holds no secrets: no deploy or publish credentials exist until a release
# process does. Install scripts never run (--ignore-scripts), actions are
# pinned by commit, and the checkout keeps no token on disk.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # The gate tests in test/gate/ are the Phase 1 done criteria; a failure
      # here blocks the change.
      - run: npm test

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24'
          cache: false
      # Fails on any known vulnerability in the lockfile, and on a scan error.
      - run: go run github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.5.1 scan source --lockfile=package-lock.json
